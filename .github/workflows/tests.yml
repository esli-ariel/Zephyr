name: Backend tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check frontend/app.js
      - run: node --check frontend/oral-answer.js
      - run: node --check frontend/journey-ui.js
      - run: node --check frontend/camera-controller.js
      - run: node --check frontend/companion-ui.js
      - run: node --check frontend/learning-ui.js
      - run: node --check frontend/account-ui.js
      - run: node --check frontend/voice-loop.js
      - run: node --check frontend/voice-tools.js
      - run: node --check frontend/voice-engine.js
      - run: node --check frontend/voice-settings.js
      - run: node --check frontend/visual-vocabulary.js
      - run: node --test frontend/tests/*.test.cjs
